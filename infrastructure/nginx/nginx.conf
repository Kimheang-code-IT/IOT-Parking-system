# Smart IoT Parking — reverse proxy for the Docker Compose stack
#
#   /            -> Nuxt frontend  (frontend:3000)
#   /api/        -> FastAPI        (backend:8000)   REST + WebSocket upgrade
#   /docs, /redoc, /openapi.json -> FastAPI docs (development policy; remove
#                                   these blocks for locked-down deployments)
#   /health      -> FastAPI health (used by monitoring / uptime checks)
#
# Service names are resolved through Docker's embedded DNS. Re-resolution is
# enabled (resolver + variable upstreams) so recreating a container never
# leaves nginx pointing at a stale IP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10m;

    # --- conservative security headers (LAN/HTTP profile) -------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/wasm;

    # Docker embedded DNS + lazy re-resolution for the variable upstreams below
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend_upstream  http://backend:8000;
    set $frontend_upstream http://frontend:3000;

    # ------------------------------------------------------------- backend
    location = /health {
        proxy_pass $backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /api {
        return 301 /api/;
    }

    # REST API + WebSocket upgrade support
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        # WebSocket / SSE upgrade support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        # long enough for payment waits / device long-polling
        proxy_read_timeout    300s;
        # stream-friendly for long-poll endpoints
        proxy_buffering off;
    }

    # API docs — development policy. Comment these three blocks out to hide
    # the schema/API explorer on shared networks.
    location = /docs {
        proxy_pass $backend_upstream/docs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location = /redoc {
        proxy_pass $backend_upstream/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /openapi.json {
        proxy_pass $backend_upstream/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ------------------------------------------------------------ frontend
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
