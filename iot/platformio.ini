; Smart IoT Parking — ESP32 gate firmware (PlatformIO, Arduino framework)
;
; Environments
;   esp32dev    default env (ENTRY role) — `pio run`
;   entry_gate  entry lane ESP32: RC522 RFID + servo + LCD + LEDs + presence ultrasonic
;   exit_gate   exit lane ESP32: same firmware in EXIT role (RFID exit + payment gate)
;   native      host unit tests for lib/parking_core — `pio test -e native`
;               (needs a host C++ compiler on PATH; see iot/test/README)
;
; Common commands
;   pio run                          build default (entry) env
;   pio run -e exit_gate             build exit-gate env
;   pio run -e entry_gate -t upload --upload-port COM5
;   pio device monitor -b 115200
;   pio test -e native               run firmware unit tests on the PC
;
; Wi-Fi credentials / API URL / device tokens: copy
;   include/parking_secrets.example.h -> include/parking_secrets.h
; (parking_secrets.h is git-ignored)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DPARKING_GATE_ROLE=1
lib_deps =
    madhephaestus/ESP32Servo@3.2.1
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    miguelbalboa/MFRC522@1.4.12
    bblanchon/ArduinoJson@7.4.3

[env:entry_gate]
extends = env:esp32dev

[env:exit_gate]
extends = env:esp32dev
build_flags =
    -DPARKING_GATE_ROLE=2

; Host tests for the pure logic in lib/parking_core (no Arduino hardware needed).
[env:native]
platform = native
test_framework = unity
test_build_src = false
build_flags =
    -DPARKING_GATE_ROLE=1
